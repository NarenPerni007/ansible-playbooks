---
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Remove default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Deploy reverse-proxy vhost
  template:
    src: vhost.conf.j2
    dest: /etc/nginx/sites-available/app
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable app site
  file:
    src: /etc/nginx/sites-available/app
    dest: /etc/nginx/sites-enabled/app
    state: link
  notify: reload nginx

- name: Enable and start nginx
  service:
    name: nginx
    state: started
    enabled: true
