---
- name: Create the apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Docker GPG key into its own keyring
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ docker_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Docker apt repo
  apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by={{ docker_keyring_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker engine and compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
