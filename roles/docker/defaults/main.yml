---
# The Docker apt repo is signed with this key only (see the signed-by
# option in tasks/main.yml), instead of trusting it for every repo.
docker_keyring_path: /etc/apt/keyrings/docker.asc

# ansible_architecture reports x86_64 / aarch64, apt wants amd64 / arm64.
docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'amd64') }}"
