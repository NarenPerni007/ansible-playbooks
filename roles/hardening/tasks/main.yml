---
- name: Deploy hardened sshd config
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd

- name: Deploy sysctl hardening
  template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload sysctl

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present

- name: Enable and start fail2ban
  service:
    name: fail2ban
    state: started
    enabled: true
